aid: grove
name: Grove
description: 'Grove (Grove Collaborative) is a direct-to-consumer retailer of everyday
  household essentials for a healthier home and planet, including eco-friendly cleaning
  products, bamboo paper products, personal care, and vitamins & supplements sourced
  from hundreds of vetted brands alongside its own private labels. Orders are held
  to strict ingredient standards, are carbon neutral, and support plastic-waste cleanup.
  The business runs as a subscription-friendly e-commerce storefront (hosted on Shopify).
  It was surfaced as a portfolio company of Norwest Venture Partners and added to the
  API Evangelist network; Grove operates a consumer retail storefront and publishes
  no public developer API, so this profile captures its identity and web properties
  rather than API artifacts.'
